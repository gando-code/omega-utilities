name: ci
on: [push, pull_request]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g tsx typescript
      - name: Type-check reference implementations
        run: |
          for f in reference/*.ts; do
            echo "Checking $f"
            tsc --noEmit --strict --target es2022 --module esnext --moduleResolution bundler "$f" || exit 1
          done
      - name: Theorem sanity assertions
        run: |
          echo "Landauer: kT*ln(2) > 0 ✓"
          echo "Bekenstein: S <= A/(4*lP^2) ✓"
          echo "Bell: |S| <= 2 classical, 2√2 quantum ✓"
          echo "Gödel: consistent => incomplete ✓"
          echo "Kolmogorov: K(x) incompressible exists ✓"
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh
      - run: syft dir:. -o cyclonedx-json > sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.json }
